services:
  scheduler:
    env_file: .env
    environment:
      WAREHOUSE_HOST: warehouse
      WAREHOUSE_PORT: 5432

  warehouse:
    image: postgres:16
    env_file: .env
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - warehouse_data:/var/lib/postgresql/data
    networks:
      - airflow

  superset:
    image: rideledger-superset
    env_file: .env
    ports:
      - "127.0.0.1:8088:8088"
    volumes:
      - superset_data:/app/superset_home
    networks:
      - airflow

volumes:
  warehouse_data:
  superset_data:
